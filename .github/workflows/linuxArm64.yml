name: Linux ARM64 CI
on:
  push:
    branches:
      [ master, development ]
  pull_request:
      types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  GITHUB_CI_COMPATIBILITY_PATH: /usr/lib/aarch64-linux-gnu

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        BUILD_CONFIGURATION: [Debug, Release]

    steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Check Out Sources
      uses: actions/checkout@v4
      with:
        submodules: recursive
        path: src

    - name: Install Dependencies (ARM64 cross packages)
      run: |
        sudo dpkg --add-architecture arm64
        sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || \
        sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
        sudo tee /etc/apt/sources.list.d/arm64-ports.list <<EOF
        deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
        deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
        deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
        EOF

        sudo apt-get update
        sudo apt-get -y install \
          cmake ninja-build \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          libsdl2-dev:arm64 libsdl2-mixer-dev:arm64 \
          libsdl2-ttf-dev:arm64 libsdl2-image-dev:arm64 \
          libgtest-dev:arm64 \
          libspdlog-dev:arm64 libfmt-dev:arm64 \
          rapidjson-dev \
          -o APT::Immediate-Configure=0

    - name: Generate Build System - ${{matrix.BUILD_CONFIGURATION}}
      run: |
        cd ${{ github.workspace }}
        mkdir build_${{matrix.BUILD_CONFIGURATION}}
        cd build_${{matrix.BUILD_CONFIGURATION}}
        cmake -GNinja \
          -DCMAKE_BUILD_TYPE=${{matrix.BUILD_CONFIGURATION}} \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DUSE_64_BIT=True \
          -DUNIT_TESTS=True \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DGITHUB_CI_COMPATIBILITY_PATH="${{env.GITHUB_CI_COMPATIBILITY_PATH}}" \
          ${{ github.workspace }}/src

    - name: Build - ${{matrix.BUILD_CONFIGURATION}}
      run: |
        cd ${{ github.workspace }}/build_${{matrix.BUILD_CONFIGURATION}}
        ninja

    - name: Run Unit Tests
      run: |
        docker run --rm --platform linux/arm64 \
          -v ${{ github.workspace }}/build_${{matrix.BUILD_CONFIGURATION}}:/build \
          ubuntu:latest \
          bash -c "apt-get update -q && apt-get install -y -q \
            libsdl2-2.0-0 libsdl2-mixer-2.0-0 \
            libsdl2-ttf-2.0-0 libsdl2-image-2.0-0 \
            libpng16-16 libfmt9 libspdlog1.12 \
            && /build/remc2-unit-test/remc2-unit-test"